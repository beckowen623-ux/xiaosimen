<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" font-family="Times New Roman, SimSun, serif" font-size="14" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect width="320" height="210" fill="#fff" stroke="none"/>
  <!-- Origin O at (160, 170) -->
  <!-- Base straight line / ray OA to right, OB up-left, OC moving ray in between -->
  <line x1="160" y1="170" x2="290" y2="170" stroke="#111" stroke-width="2"/>
  <line x1="160" y1="170" x2="45" y2="120" stroke="#111" stroke-width="2"/>
  <!-- Moving ray OC (dashed red-orange) -->
  <line x1="160" y1="170" x2="205" y2="45" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Angle bisector OM of ∠AOC (blue) -->
  <line x1="160" y1="170" x2="262" y2="108" stroke="#2563eb" stroke-width="1.8"/>
  <!-- Angle bisector ON of ∠BOC (blue) -->
  <line x1="160" y1="170" x2="98" y2="58" stroke="#2563eb" stroke-width="1.8"/>
  <!-- Equal angle arcs for ∠AOM and ∠MOC -->
  <path d="M 206 170 A 46 46 0 0 0 199 146" stroke="#2563eb" stroke-width="1.4"/>
  <path d="M 199 146 A 46 46 0 0 0 176 127" stroke="#2563eb" stroke-width="1.4"/>
  <!-- Equal angle arcs for ∠CON and ∠NOB (double arc) -->
  <path d="M 172 135 A 37 37 0 0 0 142 138" stroke="#059669" stroke-width="1.4"/>
  <path d="M 142 138 A 37 37 0 0 0 126 155" stroke="#059669" stroke-width="1.4"/>
  <path d="M 174 130 A 42 42 0 0 0 140 133" stroke="#059669" stroke-width="1.4"/>
  <path d="M 140 133 A 42 42 0 0 0 121 153" stroke="#059669" stroke-width="1.4"/>
  <!-- Rotation arrow near OC -->
  <path d="M 218 66 A 115 115 0 0 0 184 52" stroke="#d97706" stroke-width="1.3"/>
  <polyline points="190,48 183,52 189,57" stroke="#d97706" stroke-width="1.3"/>
  <!-- Vertex O -->
  <circle cx="160" cy="170" r="3" fill="#111" stroke="none"/>
  <!-- Labels -->
  <text x="160" y="190" fill="#111" stroke="none" text-anchor="middle">O</text>
  <text x="297" y="175" fill="#111" stroke="none" text-anchor="start">A</text>
  <text x="35" y="122" fill="#111" stroke="none" text-anchor="end">B</text>
  <text x="208" y="38" fill="#d97706" stroke="none" text-anchor="middle">C（动射线）</text>
  <text x="272" y="106" fill="#2563eb" stroke="none" text-anchor="start">M</text>
  <text x="90" y="52" fill="#2563eb" stroke="none" text-anchor="end">N</text>
  <!-- Formula note -->
  <text x="160" y="20" fill="#1e3a8a" stroke="none" text-anchor="middle" font-size="13">OM、ON 分别平分 ∠AOC、∠BOC，则 ∠MON = ½∠AOB</text>
</svg>
