<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" font-family="Times New Roman, SimSun, serif" font-size="13" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect width="320" height="210" fill="#fff" stroke="none"/>
  <!-- Divider -->
  <line x1="160" y1="18" x2="160" y2="195" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- LEFT: Perpendicular bisector of AB -->
  <text x="80" y="20" fill="#1e3a8a" stroke="none" text-anchor="middle" font-size="13">① 线段垂直平分线</text>
  <line x1="25" y1="115" x2="135" y2="115" stroke="#111" stroke-width="2"/>
  <!-- Arcs from A(25,115) and B(135,115), r=76 -->
  <path d="M 65 50 A 76 76 0 0 1 92 68" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4,3"/>
  <path d="M 95 50 A 76 76 0 0 0 68 68" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4,3"/>
  <path d="M 65 180 A 76 76 0 0 0 92 162" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4,3"/>
  <path d="M 95 180 A 76 76 0 0 1 68 162" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4,3"/>
  <!-- Line CD -->
  <line x1="80" y1="40" x2="80" y2="190" stroke="#dc2626" stroke-width="1.8"/>
  <!-- Right angle symbol -->
  <polyline points="80,106 89,106 89,115" stroke="#111" stroke-width="1.2"/>
  <circle cx="25" cy="115" r="2.6" fill="#111" stroke="none"/>
  <circle cx="135" cy="115" r="2.6" fill="#111" stroke="none"/>
  <circle cx="80" cy="62" r="2.6" fill="#dc2626" stroke="none"/>
  <circle cx="80" cy="168" r="2.6" fill="#dc2626" stroke="none"/>
  <text x="17" y="120" fill="#111" stroke="none" text-anchor="end">A</text>
  <text x="143" y="120" fill="#111" stroke="none" text-anchor="start">B</text>
  <text x="90" y="56" fill="#dc2626" stroke="none" text-anchor="start">C</text>
  <text x="90" y="180" fill="#dc2626" stroke="none" text-anchor="start">D</text>

  <!-- RIGHT: Angle bisector of ∠AOB -->
  <text x="242" y="20" fill="#1e3a8a" stroke="none" text-anchor="middle" font-size="13">② 角平分线（SSS）</text>
  <!-- Vertex O at (185, 165) -->
  <line x1="185" y1="165" x2="305" y2="165" stroke="#111" stroke-width="2"/>
  <line x1="185" y1="165" x2="255" y2="55" stroke="#111" stroke-width="2"/>
  <!-- First arc centered at O, r=55 -->
  <path d="M 240 165 A 55 55 0 0 0 214 118" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4,3"/>
  <!-- Intersecting arcs from M(240,165) and N(214,118) -->
  <path d="M 258 118 A 50 50 0 0 1 282 135" stroke="#059669" stroke-width="1.3" stroke-dasharray="4,3"/>
  <path d="M 264 134 A 50 50 0 0 0 278 110" stroke="#059669" stroke-width="1.3" stroke-dasharray="4,3"/>
  <!-- Bisector ray OP -->
  <line x1="185" y1="165" x2="296" y2="105" stroke="#dc2626" stroke-width="1.8"/>
  <circle cx="185" cy="165" r="2.6" fill="#111" stroke="none"/>
  <circle cx="240" cy="165" r="2.5" fill="#2563eb" stroke="none"/>
  <circle cx="214" cy="118" r="2.5" fill="#2563eb" stroke="none"/>
  <circle cx="269" cy="120" r="2.6" fill="#dc2626" stroke="none"/>
  <text x="176" y="176" fill="#111" stroke="none" text-anchor="middle">O</text>
  <text x="240" y="182" fill="#2563eb" stroke="none" text-anchor="middle">M</text>
  <text x="204" y="114" fill="#2563eb" stroke="none" text-anchor="end">N</text>
  <text x="275" y="109" fill="#dc2626" stroke="none" text-anchor="start">P</text>
</svg>
