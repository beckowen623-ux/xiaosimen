<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" font-family="sans-serif">
  <rect width="320" height="210" fill="#ffffff"/>
  <text x="160" y="18" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">三角形角平分线三大夹角模型</text>
  <!-- 模型1: 双内角平分线 -->
  <g transform="translate(8,28)">
    <rect x="0" y="0" width="96" height="142" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="16" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">① 双内角平分线</text>
    <polygon points="48,30 14,104 82,104" fill="none" stroke="#111" stroke-width="1.6"/>
    <polyline points="14,104 48,76 82,104" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    <circle cx="48" cy="76" r="2.2" fill="#2563eb"/>
    <text x="48" y="27" font-size="10" fill="#111" text-anchor="middle">A</text>
    <text x="8" y="108" font-size="10" fill="#111" text-anchor="middle">B</text>
    <text x="88" y="108" font-size="10" fill="#111" text-anchor="middle">C</text>
    <text x="48" y="69" font-size="10" fill="#2563eb" text-anchor="middle">P</text>
    <text x="48" y="124" font-size="10" fill="#1e293b" text-anchor="middle">∠P＝90°＋½∠A</text>
    <text x="48" y="137" font-size="9" fill="#64748b" text-anchor="middle">内心必为钝角</text>
  </g>
  <!-- 模型2: 一内一外角平分线 -->
  <g transform="translate(112,28)">
    <rect x="0" y="0" width="96" height="142" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="16" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">② 一内一外平分</text>
    <polygon points="34,34 12,100 54,100" fill="none" stroke="#111" stroke-width="1.6"/>
    <line x1="54" y1="100" x2="88" y2="100" stroke="#111" stroke-width="1.4" stroke-dasharray="3 2"/>
    <polyline points="12,100 78,60 54,100" fill="none" stroke="#059669" stroke-width="1.6"/>
    <circle cx="78" cy="60" r="2.2" fill="#059669"/>
    <text x="34" y="30" font-size="10" fill="#111" text-anchor="middle">A</text>
    <text x="8" y="104" font-size="10" fill="#111" text-anchor="middle">B</text>
    <text x="54" y="111" font-size="10" fill="#111" text-anchor="middle">C</text>
    <text x="86" y="111" font-size="10" fill="#111" text-anchor="middle">D</text>
    <text x="84" y="58" font-size="10" fill="#059669" text-anchor="middle">P</text>
    <text x="48" y="124" font-size="10" fill="#1e293b" text-anchor="middle">∠P＝½∠A</text>
    <text x="48" y="137" font-size="9" fill="#64748b" text-anchor="middle">外角减内角巧消</text>
  </g>
  <!-- 模型3: 双外角平分线 -->
  <g transform="translate(216,28)">
    <rect x="0" y="0" width="96" height="142" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="48" y="16" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">③ 双外角平分线</text>
    <polygon points="48,30 22,72 74,72" fill="none" stroke="#111" stroke-width="1.6"/>
    <line x1="22" y1="72" x2="10" y2="92" stroke="#111" stroke-width="1.3" stroke-dasharray="3 2"/>
    <line x1="74" y1="72" x2="86" y2="92" stroke="#111" stroke-width="1.3" stroke-dasharray="3 2"/>
    <polyline points="22,72 48,108 74,72" fill="none" stroke="#dc2626" stroke-width="1.6"/>
    <circle cx="48" cy="108" r="2.2" fill="#dc2626"/>
    <text x="48" y="27" font-size="10" fill="#111" text-anchor="middle">A</text>
    <text x="15" y="72" font-size="10" fill="#111" text-anchor="middle">B</text>
    <text x="81" y="72" font-size="10" fill="#111" text-anchor="middle">C</text>
    <text x="48" y="117" font-size="10" fill="#dc2626" text-anchor="middle">P</text>
    <text x="48" y="128" font-size="10" fill="#1e293b" text-anchor="middle">∠P＝90°－½∠A</text>
    <text x="48" y="139" font-size="9" fill="#64748b" text-anchor="middle">与①角互补</text>
  </g>
  <!-- 底部补充飞镖与8字模型口诀 -->
  <text x="160" y="192" font-size="10.5" fill="#334155" text-anchor="middle">飞镖模型：凹角＝三尖角和；8字模型：∠A＋∠B＝∠C＋∠D</text>
</svg>
