<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" font-family="Times New Roman, SimSun, serif" font-size="14" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect width="320" height="210" fill="#fff" stroke="none"/>
  <!-- Outer quadrilateral ABCD: A(65,45), B(35,165), C(265,175), D(245,55) -->
  <polygon points="65,45 35,165 265,175 245,55" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Diagonals AC and BD (dashed) -->
  <line x1="65" y1="45" x2="265" y2="175" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="35" y1="165" x2="245" y2="55" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Midpoints: E=mid(A,B)=(50,105), F=mid(B,C)=(150,170), G=mid(C,D)=(255,115), H=mid(D,A)=(155,50) -->
  <polygon points="50,105 150,170 255,115 155,50" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="2"/>
  <!-- Outer vertices -->
  <circle cx="65" cy="45" r="2.8" fill="#111" stroke="none"/>
  <circle cx="35" cy="165" r="2.8" fill="#111" stroke="none"/>
  <circle cx="265" cy="175" r="2.8" fill="#111" stroke="none"/>
  <circle cx="245" cy="55" r="2.8" fill="#111" stroke="none"/>
  <!-- Midpoint vertices -->
  <circle cx="50" cy="105" r="2.8" fill="#2563eb" stroke="none"/>
  <circle cx="150" cy="170" r="2.8" fill="#2563eb" stroke="none"/>
  <circle cx="255" cy="115" r="2.8" fill="#2563eb" stroke="none"/>
  <circle cx="155" cy="50" r="2.8" fill="#2563eb" stroke="none"/>
  <!-- Labels -->
  <text x="58" y="38" fill="#111" stroke="none" text-anchor="end">A</text>
  <text x="24" y="172" fill="#111" stroke="none" text-anchor="end">B</text>
  <text x="275" y="182" fill="#111" stroke="none" text-anchor="start">C</text>
  <text x="255" y="50" fill="#111" stroke="none" text-anchor="start">D</text>
  <text x="39" y="106" fill="#2563eb" stroke="none" text-anchor="end">E</text>
  <text x="150" y="188" fill="#2563eb" stroke="none" text-anchor="middle">F</text>
  <text x="267" y="118" fill="#2563eb" stroke="none" text-anchor="start">G</text>
  <text x="155" y="42" fill="#2563eb" stroke="none" text-anchor="middle">H</text>
  <!-- Note -->
  <text x="160" y="20" fill="#1e3a8a" stroke="none" text-anchor="middle" font-size="13">EF = GH = ½AC，FG = EH = ½BD（中点四边形恒为平行四边形）</text>
</svg>
