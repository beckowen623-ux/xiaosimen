<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230" font-family="sans-serif">
  <rect width="380" height="230" fill="#ffffff"/>
  <!-- 左图：正方形十字架模型 (x: 34..154, y: 34..154, 边长 120) -->
  <text x="94" y="22" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">① 正方形十字架模型</text>
  <rect x="34" y="34" width="120" height="120" fill="#f8fafc" stroke="#111" stroke-width="2"/>
  <!-- 设 A(34,34), B(34,154), C(154,154), D(154,34) -->
  <!-- E 在 BC 上取 (82,154) → BE=48; F 在 CD 上取 (154,106) → CF=48 -->
  <!-- AE: (34,34)→(82,154), vec=(48,120); BF: (34,154)→(154,106), vec=(120,-48) 点积=0 精确垂直且等长! -->
  <!-- 交点 P: t*(48,120) + (34,34) = s*(120,-48) + (34,154)
       48t = 120s → t = 2.5s; 120t - 120 = -48s → 300s + 48s = 120 → s = 120/348 = 10/29 ≈ 0.3448, t = 25/29 ≈ 0.862
       P = (34 + 41.4, 34 + 103.4) = (75.4, 137.4) -->
  <line x1="34" y1="34" x2="82" y2="154" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="34" y1="154" x2="154" y2="106" stroke="#c0392b" stroke-width="2.2"/>
  <!-- 交点直角符号: uAE=(0.371, 0.928), uBF=(0.928, -0.371) -->
  <polyline points="72.4,129.9 79.9,127.0 82.8,134.4" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="24" y="32" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">A</text>
  <text x="24" y="164" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">B</text>
  <text x="164" y="164" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">C</text>
  <text x="164" y="32" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">D</text>
  <text x="82" y="169" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">E</text>
  <text x="166" y="109" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F</text>
  <!-- 中间分隔虚线 -->
  <line x1="190" y1="16" x2="190" y2="174" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- 右图：赵爽弦图 (外正方形 226..346, y: 34..154, 边长 c=120; 设 3:4:5 比例或 a=42, b=78 -> 内部4个全等Rt△) -->
  <!-- 外正方形四顶点：P1(226,34), P2(346,34), P3(346,154), P4(226,154), c=120
       内小正方形顶点由 4 个直角三角形斜边在四边上构成：
       设直角边 a=48, b=96? 48²+96² ≠ 120²; 精确用 3-4-5!
       c = 120 → a = 72, b = 96! 但弦图里外框是 c，设外框逆时针 4 条斜边：
       cosθ = 4/5 = 0.8, sinθ = 3/5 = 0.6.
       P1(226,34)→P2(346,34) (底边向右): 从 P1 沿斜角向右下方走 b=96: (226 + 96*0.8, 34 + 96*0.6)? 不，cosθ = b/c = 4/5, sinθ = a/c = 3/5.
       顶点1(左上直角顶点): 距离 P1(226,34) 沿 (0.8, 0.6) 走 b=96? 让我们验证：
       Q1 = (226 + 96*0.8, 34 + 96*0.6) = (302.8, 91.6) — 算 P2 到 Q1: (346-302.8, 34-91.6) = (43.2, -57.6), 长=√(43.2²+57.6²)=72=a, 且点积=76.8*43.2+57.6*(-57.6)=3317.76-3317.76=0! 完美!
       对称得四个内部顶点 (围绕中心 (286,94), 边长 b-a = 24, 旋转对称!):
       Q1 = (302.8, 91.6) → 相对中心 (+16.8, -2.4)
       顺时针转 90° (-dy, dx):
       Q2 = (286 + 2.4, 94 + 16.8) = (288.4, 110.8)
       Q3 = (286 - 16.8, 94 + 2.4) = (269.2, 96.4)
       Q4 = (286 - 2.4, 94 - 16.8) = (283.6, 77.2)
       检验小正方形边长: Q1-Q4 = (19.2, 14.4), 长 = √(19.2²+14.4²) = 24 = 96 - 72! 100% 精确! -->
  <text x="286" y="22" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">② 赵爽弦图（勾股弦）</text>
  <rect x="226" y="34" width="120" height="120" fill="#eef4fb" stroke="#111" stroke-width="2"/>
  <polygon points="302.8,91.6 288.4,110.8 269.2,96.4 283.6,77.2" fill="#fef08a" stroke="#111" stroke-width="1.6"/>
  <line x1="226" y1="34" x2="302.8" y2="91.6" stroke="#111" stroke-width="1.6"/>
  <line x1="346" y1="34" x2="288.4" y2="110.8" stroke="#111" stroke-width="1.6"/>
  <line x1="346" y1="154" x2="269.2" y2="96.4" stroke="#111" stroke-width="1.6"/>
  <line x1="226" y1="154" x2="283.6" y2="77.2" stroke="#111" stroke-width="1.6"/>
  <text x="286" y="169" font-size="11.5" fill="#111" text-anchor="middle">大正方形面积＝c²</text>
  <text x="262" y="54" font-size="11.5" fill="#1e40af" font-weight="bold" text-anchor="middle">b</text>
  <text x="326" y="68" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="middle">a</text>
  <text x="357" y="96" font-size="12" fill="#111" font-weight="bold" text-anchor="middle">c</text>
  <!-- 底部总结论 -->
  <rect x="16" y="182" width="348" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="190" y="198" font-size="10.5" fill="#111" text-anchor="middle">十字架：正方形内垂直⇔相等（AE⊥BF⇔AE＝BF）；矩形内成边比</text>
  <text x="190" y="214" font-size="10.5" fill="#c0392b" font-weight="bold" text-anchor="middle">赵爽弦图：c²＝2ab＋(b－a)²＝a²＋b²（常考面积与周长互求）</text>
</svg>
