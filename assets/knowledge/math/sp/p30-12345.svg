<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="sans-serif">
  <rect width="360" height="230" fill="#ffffff"/>
  <!-- 在 3×3 网格 (实际画 6×6 个小方格, 每格 24px, 总宽 144×144, x:36..180, y:24..168) 中展示经典的 12345 构图 -->
  <!-- 左边：用正方形 ABCD (边长 6 格 = 144px, A(36,24)左上, B(36,168)左下, C(180,168)右下, D(180,24)右上)
       以 A(36,24) 为直角顶点：
       E 在 BC 上，取 BE = 3 格 (72px) → E(108, 168)，则 tan∠BAE = 3/6 = 1/2 (即 α)
       F 在 CD 上，取 DF = 2 格 (48px) → F(180, 72)，则 tan∠DAF = 2/6 = 1/3 (即 β)
       检验 ∠EAF = 90° - α - β = 90° - 45° = 45°!!
       且在 Rt△ECF 中：CE = 3, CF = 4, EF = 5!! (3-4-5 直角三角形!)
       而且 EF = BE + DF = 3 + 2 = 5 (正好呼应半角模型!) -->
  <!-- 6x6 浅灰网格 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="60" y1="24" x2="60" y2="168"/><line x1="84" y1="24" x2="84" y2="168"/>
    <line x1="108" y1="24" x2="108" y2="168"/><line x1="132" y1="24" x2="132" y2="168"/>
    <line x1="156" y1="24" x2="156" y2="168"/>
    <line x1="36" y1="48" x2="180" y2="48"/><line x1="36" y1="72" x2="180" y2="72"/>
    <line x1="36" y1="96" x2="180" y2="96"/><line x1="36" y1="120" x2="180" y2="120"/>
    <line x1="36" y1="144" x2="180" y2="144"/>
  </g>
  <!-- 正方形外框 -->
  <rect x="36" y="24" width="144" height="144" fill="none" stroke="#111" stroke-width="2"/>
  <!-- 两个直角三角形高亮 -->
  <polygon points="36,24 36,168 108,168" fill="#dbeafe" fill-opacity="0.55" stroke="#2563eb" stroke-width="1.8"/>
  <polygon points="36,24 180,24 180,72" fill="#dcfce7" fill-opacity="0.55" stroke="#15803d" stroke-width="1.8"/>
  <!-- 中间 45° 扇区及 EF=5 -->
  <line x1="108" y1="168" x2="180" y2="72" stroke="#c0392b" stroke-width="2.2"/>
  <!-- 角度与数字标注 -->
  <text x="53" y="75" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">α</text>
  <text x="86" y="40" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">β</text>
  <text x="86" y="74" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">45°</text>
  <text x="72" y="162" font-size="11" fill="#2563eb" font-weight="bold" text-anchor="middle">3</text>
  <text x="144" y="162" font-size="11" fill="#111" font-weight="bold" text-anchor="middle">3</text>
  <text x="171" y="52" font-size="11" fill="#15803d" font-weight="bold" text-anchor="middle">2</text>
  <text x="171" y="126" font-size="11" fill="#111" font-weight="bold" text-anchor="middle">4</text>
  <text x="137" y="114" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">5</text>
  <!-- 顶点字母 -->
  <text x="26" y="24" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">A</text>
  <text x="26" y="174" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">B</text>
  <text x="189" y="174" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">C</text>
  <text x="189" y="24" font-size="12" font-weight="bold" fill="#111" text-anchor="middle">D</text>
  <text x="108" y="180" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">E</text>
  <text x="191" y="76" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">F</text>
  <!-- 右侧 12345 黄金卡片 -->
  <rect x="202" y="24" width="144" height="144" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="274" y="45" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">12345 黄金法则</text>
  <line x1="214" y1="53" x2="334" y2="53" stroke="#cbd5e1" stroke-width="1"/>
  <text x="274" y="73" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="middle">tan α ＝ 1/2</text>
  <text x="274" y="94" font-size="12" fill="#15803d" font-weight="bold" text-anchor="middle">tan β ＝ 1/3</text>
  <text x="274" y="116" font-size="12.5" fill="#c0392b" font-weight="bold" text-anchor="middle">⇒ α＋β ＝ 45°</text>
  <text x="274" y="138" font-size="11" fill="#334155" text-anchor="middle">推论：tan(2α) ＝ 4/3</text>
  <text x="274" y="156" font-size="11" fill="#334155" text-anchor="middle">tan(2β) ＝ 3/4（3-4-5）</text>
  <!-- 底部口诀 -->
  <rect x="18" y="186" width="328" height="34" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="180" y="207" font-size="10.5" fill="#991b1b" font-weight="bold" text-anchor="middle">知二推一：α＋β＝45°、tanα＝1/2、tanβ＝1/3 知二推一！</text>
</svg>
