<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230" font-family="sans-serif">
  <rect width="360" height="230" fill="#ffffff"/>
  <!-- 圆 O(135, 108), 半径 r = 64 -->
  <!-- 定点 B(263, 108) 在圆外, OB = 128 = 2r, 故 k = r / OB = 1/2 -->
  <!-- 构造圆内定点 M 在 OB 上, 使 OM = k*r = 32 → M(167, 108) -->
  <!-- 圆上动点 P：取角度 -52°, cos=0.616, sin=-0.788 → P(135+39.4, 108-50.4) = (174.4, 57.6) -->
  <!-- 定点 A(56, 56) -->
  <circle cx="135" cy="108" r="64" fill="#f8fafc" stroke="#111" stroke-width="1.8"/>
  <!-- 直线 OB -->
  <line x1="135" y1="108" x2="263" y2="108" stroke="#64748b" stroke-width="1.5"/>
  <!-- 半径 OP -->
  <line x1="135" y1="108" x2="174.4" y2="57.6" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- PA 和 PB -->
  <line x1="56" y1="54" x2="174.4" y2="57.6" stroke="#111" stroke-width="2"/>
  <line x1="174.4" y1="57.6" x2="263" y2="108" stroke="#111" stroke-width="2"/>
  <!-- 转化线段 PM 和最短连线 AM -->
  <line x1="174.4" y1="57.6" x2="167" y2="108" stroke="#2563eb" stroke-width="2"/>
  <line x1="56" y1="54" x2="167" y2="108" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- 标注段长关系 -->
  <text x="150" y="102" font-size="10.5" fill="#2563eb" text-anchor="middle">OM＝kr</text>
  <text x="148" y="80" font-size="11" fill="#475569" text-anchor="middle">r</text>
  <text x="225" y="75" font-size="11.5" fill="#111" text-anchor="middle">PB</text>
  <text x="115" y="47" font-size="11.5" fill="#111" text-anchor="middle">PA</text>
  <text x="188" y="88" font-size="11.5" fill="#2563eb" font-weight="bold" text-anchor="middle">PM＝k·PB</text>
  <!-- 关键点 -->
  <circle cx="135" cy="108" r="3" fill="#111"/>
  <text x="124" y="118" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">O</text>
  <circle cx="167" cy="108" r="3.4" fill="#2563eb"/>
  <text x="169" y="126" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">M</text>
  <circle cx="263" cy="108" r="3" fill="#111"/>
  <text x="276" y="113" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">B</text>
  <circle cx="174.4" cy="57.6" r="3.4" fill="#111"/>
  <text x="180" y="46" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">P(动)</text>
  <circle cx="56" cy="54" r="3.4" fill="#c0392b"/>
  <text x="45" y="48" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">A</text>
  <!-- 右上角相似说明 -->
  <rect x="242" y="16" width="106" height="44" rx="5" fill="#eef4fb" stroke="#93c5fd" stroke-width="1"/>
  <text x="295" y="34" font-size="11" fill="#1e40af" font-weight="bold" text-anchor="middle">母子相似(SAS)</text>
  <text x="295" y="51" font-size="11" fill="#1e40af" text-anchor="middle">△OMP ∽ △OPB</text>
  <!-- 底部结论框 -->
  <rect x="18" y="182" width="324" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="198" font-size="11.5" fill="#111" text-anchor="middle">取圆内点 M 使 OM/r＝r/OB＝k ⇒ PM＝k·PB</text>
  <text x="180" y="214" font-size="11.5" fill="#c0392b" font-weight="bold" text-anchor="middle">PA＋k·PB＝PA＋PM ≥ AM（A、P、M 共线取最小）</text>
</svg>
