<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <!-- 外框主电路 -->
  <rect x="46" y="36" width="228" height="106" fill="none" stroke="#111" stroke-width="1.8"/>
  <!-- 电源 -->
  <rect x="114" y="24" width="26" height="24" fill="#ffffff"/>
  <line x1="122" y1="24" x2="122" y2="48" stroke="#111" stroke-width="2.2"/>
  <line x1="132" y1="30" x2="132" y2="42" stroke="#111" stroke-width="3.6"/>
  <text x="112" y="26" font-size="11" fill="#111" font-family="sans-serif">+</text>
  <text x="137" y="27" font-size="12" fill="#111" font-family="sans-serif">-</text>
  <!-- 开关 S -->
  <rect x="196" y="28" width="32" height="16" fill="#ffffff"/>
  <circle cx="198" cy="36" r="2.5" fill="#111"/>
  <circle cx="226" cy="36" r="2.5" fill="#111"/>
  <line x1="198" y1="36" x2="225" y2="30" stroke="#111" stroke-width="1.8"/>
  <text x="212" y="24" font-size="11.5" fill="#111" font-family="sans-serif" text-anchor="middle">S</text>
  <!-- 电流表 A（串联在左侧支路） -->
  <circle cx="46" cy="89" r="14" fill="#ffffff" stroke="#2c6eb5" stroke-width="1.8"/>
  <text x="46" y="93" font-size="12.5" fill="#2c6eb5" font-family="sans-serif" text-anchor="middle" font-weight="bold">A</text>
  <!-- 灯泡 L1 -->
  <circle cx="116" cy="142" r="14" fill="#ffffff" stroke="#111" stroke-width="1.8"/>
  <line x1="106" y1="132" x2="126" y2="152" stroke="#111" stroke-width="1.3"/>
  <line x1="126" y1="132" x2="106" y2="152" stroke="#111" stroke-width="1.3"/>
  <text x="116" y="168" font-size="12" fill="#111" font-family="sans-serif" text-anchor="middle">L1</text>
  <!-- 灯泡 L2 -->
  <circle cx="216" cy="142" r="14" fill="#ffffff" stroke="#111" stroke-width="1.8"/>
  <line x1="206" y1="132" x2="226" y2="152" stroke="#111" stroke-width="1.3"/>
  <line x1="226" y1="132" x2="206" y2="152" stroke="#111" stroke-width="1.3"/>
  <text x="216" y="168" font-size="12" fill="#111" font-family="sans-serif" text-anchor="middle">L2</text>
  <!-- 电压表 V 并联在 L1 两端 -->
  <polyline points="86,142 86,89 146,89 146,142" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <circle cx="86" cy="142" r="2.5" fill="#c0392b"/>
  <circle cx="146" cy="142" r="2.5" fill="#c0392b"/>
  <circle cx="116" cy="89" r="14" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="116" y="93" font-size="12.5" fill="#c0392b" font-family="sans-serif" text-anchor="middle" font-weight="bold">V</text>
  <!-- 右侧速判标签 -->
  <rect x="164" y="64" width="98" height="48" rx="4" fill="#fff8f6" stroke="#e6b8af" stroke-width="1.2"/>
  <text x="213" y="79" font-size="10.5" fill="#c0392b" font-family="sans-serif" text-anchor="middle">A无 V有 → L1断路</text>
  <text x="213" y="93" font-size="10.5" fill="#2c6eb5" font-family="sans-serif" text-anchor="middle">A有 V无 → L1短路</text>
  <text x="213" y="107" font-size="10.5" fill="#333" font-family="sans-serif" text-anchor="middle">A无 V无 → L2断路</text>
  <!-- 底部口诀 -->
  <text x="160" y="196" font-size="12" fill="#333" font-family="sans-serif" text-anchor="middle">先看电流表定“断路/短路”，再看电压表锁故障位置</text>
</svg>
