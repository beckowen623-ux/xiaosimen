<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c6eb5"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <!-- 顶部提示栏 -->
  <rect x="20" y="12" width="280" height="36" rx="5" fill="#f5f8fc" stroke="#d0dceb" stroke-width="1.2"/>
  <text x="160" y="27" font-size="11.5" fill="#111" font-family="sans-serif" text-anchor="middle">共同匀速向右：A不受摩擦（f_AB＝0），地面对B摩擦 f地＝F</text>
  <text x="160" y="42" font-size="11.5" fill="#2e7d32" font-family="sans-serif" text-anchor="middle">共同加速向右：B对A静摩擦向右，A对B静摩擦向左</text>
  <!-- 水平粗糙地面 -->
  <line x1="20" y1="152" x2="300" y2="152" stroke="#111" stroke-width="2.2"/>
  <line x1="32" y1="152" x2="25" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="58" y1="152" x2="51" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="84" y1="152" x2="77" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="110" y1="152" x2="103" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="136" y1="152" x2="129" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="162" y1="152" x2="155" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="188" y1="152" x2="181" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="214" y1="152" x2="207" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="240" y1="152" x2="233" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="266" y1="152" x2="259" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="292" y1="152" x2="285" y2="160" stroke="#666" stroke-width="1"/>
  <!-- 下方木块 B -->
  <rect x="98" y="112" width="110" height="40" fill="#f7ead9" stroke="#111" stroke-width="1.8"/>
  <text x="153" y="137" font-size="14" fill="#111" font-family="sans-serif" text-anchor="middle" font-weight="bold">B</text>
  <!-- 上方木块 A -->
  <rect x="118" y="74" width="70" height="38" fill="#dce8f8" stroke="#111" stroke-width="1.8"/>
  <text x="153" y="98" font-size="14" fill="#111" font-family="sans-serif" text-anchor="middle" font-weight="bold">A</text>
  <!-- 水平拉力 F（作用在 B 上） -->
  <line x1="208" y1="132" x2="278" y2="132" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arr-r)"/>
  <text x="246" y="124" font-size="13" fill="#c0392b" font-family="sans-serif" text-anchor="middle">拉力 F</text>
  <!-- 地面对 B 的滑动摩擦力 f地 -->
  <line x1="98" y1="146" x2="40" y2="146" stroke="#2c6eb5" stroke-width="2.2" marker-end="url(#arr-b)"/>
  <text x="66" y="138" font-size="12" fill="#2c6eb5" font-family="sans-serif" text-anchor="middle">f地</text>
  <!-- 加速时 A、B 间静摩擦虚线示意 -->
  <line x1="188" y1="98" x2="232" y2="98" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-g)"/>
  <text x="255" y="102" font-size="11" fill="#2e7d32" font-family="sans-serif" text-anchor="middle">加速时 f_B→A</text>
  <!-- 底部口诀 -->
  <text x="160" y="182" font-size="12" fill="#111" font-family="sans-serif" text-anchor="middle">整体法求地面对下物摩擦力，隔离法求叠放接触面内力</text>
  <text x="160" y="199" font-size="11.5" fill="#555" font-family="sans-serif" text-anchor="middle">静摩擦看“平衡或相对趋势”，滑动摩擦只看“压力与粗糙程度”</text>
</svg>
