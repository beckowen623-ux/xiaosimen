<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" font-family="sans-serif">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/>
    </marker>
  </defs>
  <text x="160" y="17" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">晶体熔化 vs 水沸腾 温度-时间图像对比</text>
  <!-- 左图：晶体（海波）与非晶体（石蜡）熔化 -->
  <g transform="translate(14,28)">
    <text x="68" y="10" font-size="10.5" font-weight="bold" fill="#2563eb" text-anchor="middle">① 晶体/非晶体熔化</text>
    <line x1="20" y1="126" x2="142" y2="126" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="20" y1="126" x2="20" y2="20" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="14" y="24" font-size="9.5" fill="#111" text-anchor="end">t/℃</text>
    <text x="138" y="138" font-size="9.5" fill="#111" text-anchor="middle">时间</text>
    <!-- 晶体海波曲线 AB-BC-CD -->
    <polyline points="20,114 48,72 98,72 132,34" fill="none" stroke="#2563eb" stroke-width="2.2"/>
    <line x1="20" y1="72" x2="48" y2="72" stroke="#2563eb" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="16" y="75" font-size="9" fill="#2563eb" text-anchor="end">48</text>
    <circle cx="48" cy="72" r="2.5" fill="#2563eb"/>
    <circle cx="98" cy="72" r="2.5" fill="#2563eb"/>
    <text x="44" y="66" font-size="9.5" fill="#111">B</text>
    <text x="98" y="66" font-size="9.5" fill="#111">C</text>
    <text x="73" y="84" font-size="9" fill="#2563eb" text-anchor="middle">固液共存</text>
    <text x="73" y="95" font-size="8.5" fill="#2563eb" text-anchor="middle">吸热温度不变</text>
    <!-- 非晶体石蜡虚线 -->
    <path d="M 20 118 Q 76 86 132 48" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="114" y="62" font-size="8.5" fill="#d97706">石蜡</text>
  </g>
  <!-- 右图：水沸腾图像 -->
  <g transform="translate(166,28)">
    <text x="68" y="10" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">② 水的沸腾（气压影响）</text>
    <line x1="20" y1="126" x2="142" y2="126" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
    <line x1="20" y1="126" x2="20" y2="20" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/>
    <text x="14" y="24" font-size="9.5" fill="#111" text-anchor="end">t/℃</text>
    <text x="138" y="138" font-size="9.5" fill="#111" text-anchor="middle">时间</text>
    <!-- 沸腾曲线 a（水量少） -->
    <polyline points="20,98 62,48 134,48" fill="none" stroke="#dc2626" stroke-width="2.2"/>
    <!-- 沸腾曲线 b（水量多，同沸点） -->
    <polyline points="20,98 90,48 134,48" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="4 2"/>
    <line x1="20" y1="48" x2="62" y2="48" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="17" y="51" font-size="9" fill="#dc2626" text-anchor="end">98</text>
    <text x="54" y="42" font-size="9" fill="#dc2626">少水</text>
    <text x="90" y="42" font-size="9" fill="#059669">多水</text>
    <text x="98" y="64" font-size="8.5" fill="#dc2626" text-anchor="middle">沸点＜100℃</text>
    <text x="98" y="75" font-size="8.5" fill="#475569" text-anchor="middle">气压低于1标准大气压</text>
  </g>
  <!-- 底部总结 -->
  <text x="160" y="186" font-size="10" fill="#1e293b" text-anchor="middle">共同点：水平段均“持续吸热、温度不变”；水浴加热使海波受热均匀</text>
  <text x="160" y="201" font-size="9.5" fill="#64748b" text-anchor="middle">沸腾前气泡上升变小，沸腾时气泡上升变大；加盖/用温水缩短加热时间</text>
</svg>
