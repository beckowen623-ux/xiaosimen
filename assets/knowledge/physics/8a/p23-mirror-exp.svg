<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c6eb5"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/>
    </marker>
  </defs>
  <!-- 桌面与白纸 -->
  <line x1="22" y1="154" x2="298" y2="154" stroke="#111" stroke-width="2"/>
  <line x1="36" y1="154" x2="30" y2="161" stroke="#666" stroke-width="1"/>
  <line x1="66" y1="154" x2="60" y2="161" stroke="#666" stroke-width="1"/>
  <line x1="96" y1="154" x2="90" y2="161" stroke="#666" stroke-width="1"/>
  <line x1="126" y1="154" x2="120" y2="161" stroke="#666" stroke-width="1"/>
  <line x1="196" y1="154" x2="190" y2="161" stroke="#666" stroke-width="1"/>
  <line x1="226" y1="154" x2="220" y2="161" stroke="#666" stroke-width="1"/>
  <line x1="256" y1="154" x2="250" y2="161" stroke="#666" stroke-width="1"/>
  <line x1="286" y1="154" x2="280" y2="161" stroke="#666" stroke-width="1"/>
  <!-- 薄玻璃板 -->
  <rect x="157" y="26" width="6" height="128" fill="#d9eefc" stroke="#2c6eb5" stroke-width="1.6"/>
  <text x="160" y="18" font-size="12" fill="#2c6eb5" font-family="sans-serif" text-anchor="middle">薄玻璃板（竖直）</text>
  <!-- 垂直符号 -->
  <polyline points="163,146 171,146 171,154" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- 左侧点燃蜡烛（物） -->
  <rect x="78" y="96" width="16" height="58" fill="#f7ead9" stroke="#111" stroke-width="1.6"/>
  <line x1="86" y1="96" x2="86" y2="90" stroke="#111" stroke-width="1.4"/>
  <path d="M 86 72 Q 93 84 86 91 Q 79 84 86 72 Z" fill="#f39c12" stroke="#c0392b" stroke-width="1.2"/>
  <text x="86" y="64" font-size="12" fill="#111" font-family="sans-serif" text-anchor="middle">物 A</text>
  <!-- 右侧虚像（对称） -->
  <rect x="226" y="96" width="16" height="58" fill="#f9f9f9" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 234 72 Q 241 84 234 91 Q 227 84 234 72 Z" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="234" y="64" font-size="12" fill="#555" font-family="sans-serif" text-anchor="middle">虚像 A'</text>
  <!-- 物像连线与垂直标识 -->
  <line x1="86" y1="82" x2="234" y2="82" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polyline points="150,82 150,89 157,89" fill="none" stroke="#666" stroke-width="1.1"/>
  <!-- 反射光路示意 -->
  <line x1="86" y1="82" x2="157" y2="112" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="157" y1="112" x2="48" y2="138" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="157" y1="112" x2="234" y2="82" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="34" y="144" font-size="11" fill="#c0392b" font-family="sans-serif">人眼</text>
  <!-- 物距与像距标注 -->
  <line x1="86" y1="173" x2="156" y2="173" stroke="#2c6eb5" stroke-width="1.3" marker-start="url(#arr-b)" marker-end="url(#arr-b)"/>
  <text x="121" y="169" font-size="11" fill="#2c6eb5" font-family="sans-serif" text-anchor="middle">u</text>
  <line x1="164" y1="173" x2="234" y2="173" stroke="#2c6eb5" stroke-width="1.3" marker-start="url(#arr-b)" marker-end="url(#arr-b)"/>
  <text x="199" y="169" font-size="11" fill="#2c6eb5" font-family="sans-serif" text-anchor="middle">v</text>
  <!-- 底部总结 -->
  <text x="160" y="198" font-size="12" fill="#333" font-family="sans-serif" text-anchor="middle">等大、等距（u＝v）、连线垂直镜面，反射光反向延长成虚像</text>
</svg>
