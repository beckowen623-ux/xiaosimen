<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" font-family="sans-serif">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="160" y="18" font-size="12" font-weight="bold" fill="#1e3a8a" text-anchor="middle">测量小车在斜面上的平均速度实验</text>
  <!-- 水平桌面 -->
  <line x1="16" y1="164" x2="304" y2="164" stroke="#111" stroke-width="2"/>
  <!-- 木块支座（较小坡度） -->
  <rect x="26" y="112" width="32" height="52" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/>
  <text x="42" y="142" font-size="10" fill="#92400e" text-anchor="middle">木块</text>
  <!-- 斜面木板 -->
  <line x1="26" y1="110" x2="290" y2="162" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <!-- 金属片（终点 C） -->
  <line x1="285" y1="138" x2="285" y2="162" stroke="#dc2626" stroke-width="3"/>
  <text x="285" y="132" font-size="10" fill="#dc2626" text-anchor="middle">金属片 C</text>
  <!-- 小车在起点 A -->
  <g transform="translate(46,96) rotate(11.1)">
    <rect x="0" y="0" width="30" height="14" rx="2" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.3"/>
    <circle cx="7" cy="15" r="3.5" fill="#1e293b"/>
    <circle cx="23" cy="15" r="3.5" fill="#1e293b"/>
  </g>
  <text x="58" y="88" font-size="10" fill="#1e3a8a" text-anchor="middle">A（起点）</text>
  <!-- 中点 B 虚线小车 -->
  <g transform="translate(162,119) rotate(11.1)" opacity="0.55">
    <rect x="0" y="0" width="30" height="14" rx="2" fill="#93c5fd" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 2"/>
    <circle cx="7" cy="15" r="3.2" fill="#475569"/>
    <circle cx="23" cy="15" r="3.2" fill="#475569"/>
  </g>
  <text x="176" y="110" font-size="10" fill="#2563eb" text-anchor="middle">B（中点）</text>
  <!-- 路程标注 s1, s2, s3 -->
  <line x1="74" y1="74" x2="188" y2="96" stroke="#2563eb" stroke-width="1.3" marker-start="url(#arr-b)" marker-end="url(#arr-b)"/>
  <text x="134" y="78" font-size="10.5" fill="#2563eb" text-anchor="middle">前半程 s₂</text>
  <line x1="194" y1="97" x2="282" y2="115" stroke="#059669" stroke-width="1.3" marker-start="url(#arr-b)" marker-end="url(#arr-b)"/>
  <text x="242" y="99" font-size="10.5" fill="#059669" text-anchor="middle">后半程 s₃</text>
  <!-- 全程 s1 -->
  <line x1="74" y1="50" x2="282" y2="50" stroke="#111" stroke-width="1.3" marker-start="url(#arr-b)" marker-end="url(#arr-b)"/>
  <text x="178" y="45" font-size="11" fill="#111" text-anchor="middle">全程 s₁（车头到车头）</text>
  <!-- 底部要点 -->
  <text x="160" y="185" font-size="10.5" fill="#334155" text-anchor="middle">原理：v＝s/t；坡度要缓（便于测时间）；v₃ ＞ v₁ ＞ v₂</text>
  <text x="160" y="200" font-size="10" fill="#dc2626" text-anchor="middle">避坑：后半程时间 t₃＝t₁－t₂（不可从 B 静止释放）</text>
</svg>
