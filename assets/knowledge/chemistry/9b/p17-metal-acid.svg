<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f2937"/>
    </marker>
  </defs>
  <text x="160" y="14" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#111827" font-family="sans-serif">金属与酸反应四大经典图像（Mg/Al/Zn/Fe）</text>

  <!-- Quadrant 1 (Top-Left): 等质金属 + 足量酸 vs 时间 t -->
  <rect x="6" y="20" width="151" height="90" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="81" y="31" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e3a8a" font-family="sans-serif">① 等质金属＋足量酸（横轴：时间）</text>
  <line x1="24" y1="98" x2="146" y2="98" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="24" y1="98" x2="24" y2="38" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="148" y="106" text-anchor="end" font-size="7.5" fill="#334155" font-family="sans-serif">t</text>
  <text x="10" y="46" font-size="7.5" fill="#334155" font-family="sans-serif">H2</text>
  <!-- Al: highest plateau, 2nd slope -->
  <polyline points="24,98 62,44 134,44" fill="none" stroke="#9333ea" stroke-width="1.6"/>
  <!-- Mg: 2nd plateau, steepest slope -->
  <polyline points="24,98 46,56 134,56" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <!-- Fe: 3rd plateau, gentlest slope -->
  <polyline points="24,98 92,72 134,72" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <!-- Zn: lowest plateau, 3rd slope -->
  <polyline points="24,98 72,82 134,82" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text x="136" y="46" font-size="7.5" fill="#9333ea" font-family="sans-serif">Al</text>
  <text x="136" y="58" font-size="7.5" fill="#dc2626" font-family="sans-serif">Mg</text>
  <text x="136" y="74" font-size="7.5" fill="#2563eb" font-family="sans-serif">Fe</text>
  <text x="136" y="84" font-size="7.5" fill="#16a34a" font-family="sans-serif">Zn</text>
  <text x="82" y="107" text-anchor="middle" font-size="7.2" fill="#475569" font-family="sans-serif">斜率看活泼，平台Al&gt;Mg&gt;Fe&gt;Zn</text>

  <!-- Quadrant 2 (Top-Right): 足量金属 + 等质酸 vs 时间 t -->
  <rect x="163" y="20" width="151" height="90" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="238" y="31" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e3a8a" font-family="sans-serif">② 足量金属＋等质酸（横轴：时间）</text>
  <line x1="181" y1="98" x2="303" y2="98" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="181" y1="98" x2="181" y2="38" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="106" text-anchor="end" font-size="7.5" fill="#334155" font-family="sans-serif">t</text>
  <text x="167" y="46" font-size="7.5" fill="#334155" font-family="sans-serif">H2</text>
  <!-- All reach same plateau y=54, order Mg, Al, Zn, Fe -->
  <polyline points="181,98 202,54 294,54" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <polyline points="181,98 218,54 294,54" fill="none" stroke="#9333ea" stroke-width="1.6"/>
  <polyline points="181,98 238,54 294,54" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <polyline points="181,98 262,54 294,54" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <text x="196" y="51" font-size="7.2" fill="#dc2626" font-family="sans-serif">Mg</text>
  <text x="215" y="51" font-size="7.2" fill="#9333ea" font-family="sans-serif">Al</text>
  <text x="234" y="51" font-size="7.2" fill="#16a34a" font-family="sans-serif">Zn</text>
  <text x="258" y="51" font-size="7.2" fill="#2563eb" font-family="sans-serif">Fe</text>
  <text x="238" y="107" text-anchor="middle" font-size="7.2" fill="#475569" font-family="sans-serif">酸全反应，平台等高；先折更活泼</text>

  <!-- Quadrant 3 (Bottom-Left): 等质金属 + 逐加酸 vs m(酸) -->
  <rect x="6" y="114" width="151" height="90" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="81" y="125" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e3a8a" font-family="sans-serif">③ 等质金属逐加酸（横轴：酸质量）</text>
  <line x1="24" y1="191" x2="146" y2="191" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="24" y1="191" x2="24" y2="132" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="148" y="199" text-anchor="end" font-size="7.2" fill="#334155" font-family="sans-serif">m(酸)</text>
  <text x="10" y="140" font-size="7.5" fill="#334155" font-family="sans-serif">H2</text>
  <!-- Shared diagonal from (24,191) slope ~ -1 -->
  <polyline points="24,191 77,138 134,138" fill="none" stroke="#9333ea" stroke-width="1.6"/>
  <polyline points="24,191 65,150 134,150" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <polyline points="24,191 51,164 134,164" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <polyline points="24,191 41,174 134,174" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text x="136" y="140" font-size="7.5" fill="#9333ea" font-family="sans-serif">Al</text>
  <text x="136" y="152" font-size="7.5" fill="#dc2626" font-family="sans-serif">Mg</text>
  <text x="136" y="166" font-size="7.5" fill="#2563eb" font-family="sans-serif">Fe</text>
  <text x="136" y="176" font-size="7.5" fill="#16a34a" font-family="sans-serif">Zn</text>
  <text x="78" y="201" text-anchor="middle" font-size="7.2" fill="#475569" font-family="sans-serif">等酸产等氢→初段重合，后看平台</text>

  <!-- Quadrant 4 (Bottom-Right): 等质酸 + 逐加金属 vs m(金属) -->
  <rect x="163" y="114" width="151" height="90" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="238" y="125" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e3a8a" font-family="sans-serif">④ 等质酸逐加金属（横轴：金属质量）</text>
  <line x1="181" y1="191" x2="303" y2="191" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="181" y1="191" x2="181" y2="132" stroke="#1f2937" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="305" y="199" text-anchor="end" font-size="7" fill="#334155" font-family="sans-serif">m(金)</text>
  <text x="167" y="140" font-size="7.5" fill="#334155" font-family="sans-serif">H2</text>
  <!-- Same plateau y=148; slope order = valence/Ar: Al > Mg > Fe > Zn -->
  <polyline points="181,191 198,148 294,148" fill="none" stroke="#9333ea" stroke-width="1.6"/>
  <polyline points="181,191 214,148 294,148" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <polyline points="181,191 242,148 294,148" fill="none" stroke="#2563eb" stroke-width="1.6"/>
  <polyline points="181,191 264,148 294,148" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text x="193" y="145" font-size="7.2" fill="#9333ea" font-family="sans-serif">Al</text>
  <text x="210" y="145" font-size="7.2" fill="#dc2626" font-family="sans-serif">Mg</text>
  <text x="238" y="145" font-size="7.2" fill="#2563eb" font-family="sans-serif">Fe</text>
  <text x="260" y="145" font-size="7.2" fill="#16a34a" font-family="sans-serif">Zn</text>
  <text x="234" y="201" text-anchor="middle" font-size="7.2" fill="#475569" font-family="sans-serif">初斜率看价/Ar：Al&gt;Mg&gt;Fe&gt;Zn</text>
</svg>
