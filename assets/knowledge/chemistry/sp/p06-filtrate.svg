<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/></marker>
  </defs>
  <text x="160" y="18" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111" font-family="sans-serif">向 AgNO3、Cu(NO3)2 混合液加 Fe 粉：四区间法</text>

  <!-- Reaction order banner -->
  <rect x="10" y="26" width="300" height="22" rx="4" fill="#fff3cc" stroke="#b7791f" stroke-width="1.2"/>
  <text x="160" y="41" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111" font-family="sans-serif">顺序(远距离优先)：① Fe＋2AgNO3→2Ag  →  ② Fe＋Cu(NO3)2→Cu</text>

  <!-- Number axis of Fe mass -->
  <line x1="14" y1="68" x2="306" y2="68" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="298" y="61" text-anchor="end" font-size="9" fill="#111" font-family="sans-serif">m(Fe)增大</text>

  <!-- Ticks / Critical points -->
  <circle cx="90" cy="68" r="3.5" fill="#c0392b"/>
  <circle cx="165" cy="68" r="3.5" fill="#2c6eb5"/>
  <circle cx="240" cy="68" r="3.5" fill="#2e7d32"/>
  <text x="90" y="60" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#c0392b" font-family="sans-serif">Ag⁺恰耗尽</text>
  <text x="240" y="60" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2e7d32" font-family="sans-serif">Cu²⁺恰耗尽</text>

  <!-- 4 Zone boxes -->
  <!-- Zone 1 -->
  <rect x="10" y="78" width="72" height="90" rx="4" fill="#eef4fb" stroke="#2c6eb5" stroke-width="1.2"/>
  <text x="46" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2c6eb5" font-family="sans-serif">区间① 极少</text>
  <text x="46" y="107" text-anchor="middle" font-size="9" fill="#111" font-family="sans-serif">渣：Ag</text>
  <line x1="16" y1="113" x2="76" y2="113" stroke="#b0c4de" stroke-width="0.8"/>
  <text x="46" y="126" text-anchor="middle" font-size="8.5" fill="#333" font-family="sans-serif">液：Fe²⁺</text>
  <text x="46" y="139" text-anchor="middle" font-size="8.5" fill="#2c6eb5" font-family="sans-serif">Cu²⁺、Ag⁺</text>
  <text x="46" y="158" text-anchor="middle" font-size="8.5" fill="#c0392b" font-family="sans-serif">(液加HCl白↓)</text>

  <!-- Zone 2 -->
  <rect x="86" y="78" width="72" height="90" rx="4" fill="#eef4fb" stroke="#2c6eb5" stroke-width="1.2"/>
  <text x="122" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2c6eb5" font-family="sans-serif">区间② 换部分Cu</text>
  <text x="122" y="107" text-anchor="middle" font-size="9" fill="#111" font-family="sans-serif">渣：Ag、Cu</text>
  <line x1="92" y1="113" x2="152" y2="113" stroke="#b0c4de" stroke-width="0.8"/>
  <text x="122" y="126" text-anchor="middle" font-size="8.5" fill="#333" font-family="sans-serif">液：Fe²⁺</text>
  <text x="122" y="139" text-anchor="middle" font-size="8.5" fill="#2c6eb5" font-family="sans-serif">Cu²⁺(剩)</text>
  <text x="122" y="158" text-anchor="middle" font-size="8.5" fill="#2c6eb5" font-family="sans-serif">(滤液呈蓝色)</text>

  <!-- Zone 3 -->
  <rect x="162" y="78" width="72" height="90" rx="4" fill="#e6f7ee" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="198" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e7d32" font-family="sans-serif">点③ 恰换完Cu</text>
  <text x="198" y="107" text-anchor="middle" font-size="9" fill="#111" font-family="sans-serif">渣：Ag、Cu</text>
  <line x1="168" y1="113" x2="228" y2="113" stroke="#a3d9b1" stroke-width="0.8"/>
  <text x="198" y="128" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">液：只有Fe²⁺</text>
  <text x="198" y="143" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">(浅绿色)</text>
  <text x="198" y="158" text-anchor="middle" font-size="8.5" fill="#555" font-family="sans-serif">(渣加酸无气泡)</text>

  <!-- Zone 4 -->
  <rect x="238" y="78" width="72" height="90" rx="4" fill="#ffeaea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="274" y="92" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b" font-family="sans-serif">区间④ Fe过量</text>
  <text x="274" y="107" text-anchor="middle" font-size="9" fill="#c0392b" font-family="sans-serif">渣：Ag Cu Fe</text>
  <line x1="244" y1="113" x2="304" y2="113" stroke="#f5b7b1" stroke-width="0.8"/>
  <text x="274" y="128" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">液：只有Fe²⁺</text>
  <text x="274" y="143" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">(浅绿色)</text>
  <text x="274" y="158" text-anchor="middle" font-size="8.5" fill="#c0392b" font-family="sans-serif">(渣加酸有气泡)</text>

  <!-- Bottom rule -->
  <rect x="10" y="175" width="300" height="27" rx="4" fill="#f8f9fa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="160" y="187" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b" font-family="sans-serif">必含规律：滤渣一定有 Ag；滤液一定有 Fe(NO3)2（亚铁！）</text>
  <text x="160" y="199" text-anchor="middle" font-size="8.5" fill="#333" font-family="sans-serif">临界点①(恰换完Ag⁺)：渣只有Ag，液有Fe²⁺、Cu²⁺(蓝色)</text>
</svg>
