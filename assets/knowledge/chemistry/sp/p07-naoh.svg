<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200"><rect width="320" height="200" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker></defs>
      <rect x="24" y="34" width="116" height="44" rx="5" fill="#eef4fb" stroke="#111" stroke-width="1.6"/>
      <text x="32" y="54" font-size="11" fill="#111" font-family="sans-serif">Step 1: 加过量 CaCl2</text>
      <text x="32" y="70" font-size="10" fill="#2c6eb5" font-family="sans-serif">检验并除尽 Na2CO3</text>
      <line x1="140" y1="56" x2="170" y2="56" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/>
      <rect x="172" y="34" width="124" height="44" rx="5" fill="#ffeaea" stroke="#c0392b" stroke-width="1.6"/>
      <text x="180" y="54" font-size="11" fill="#c0392b" font-family="sans-serif">Step 2: 滤液加酚酞</text>
      <text x="180" y="70" font-size="10" fill="#c0392b" font-family="sans-serif">变红→部分；无色→完全</text>
      <text x="28" y="122" font-size="11" fill="#111" font-family="sans-serif">为什么不能用 Ca(OH)2 代替 CaCl2：</text>
      <text x="28" y="146" font-size="11" fill="#c0392b" font-family="sans-serif">Ca(OH)2 与 Na2CO3 反应会生成新 NaOH，干扰检验！</text>
      <text x="28" y="176" font-size="11" fill="#333" font-family="sans-serif">核心：必须用中性钙盐/钡盐（CaCl2/BaCl2）除尽 CO3²⁻</text>
    </svg>