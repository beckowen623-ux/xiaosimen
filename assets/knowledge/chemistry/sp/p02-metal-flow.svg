<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2e7d32"/></marker>
  </defs>
  <text x="160" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#111" font-family="sans-serif">废液回收铜与 FeSO4 晶体流程</text>

  <!-- Step 1: Waste liquid -->
  <rect x="8" y="34" width="70" height="44" rx="5" fill="#eef4fb" stroke="#111" stroke-width="1.5"/>
  <text x="43" y="52" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111" font-family="sans-serif">工业废液</text>
  <text x="43" y="68" text-anchor="middle" font-size="9" fill="#2c6eb5" font-family="sans-serif">CuSO4/FeSO4</text>

  <!-- Arrow + excess Fe -->
  <line x1="78" y1="56" x2="124" y2="56" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr-r)"/>
  <text x="101" y="45" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b" font-family="sans-serif">过量铁粉</text>
  <text x="101" y="70" text-anchor="middle" font-size="8.5" fill="#555" font-family="sans-serif">完全置换Cu</text>

  <!-- Step 2: Filter 1 -->
  <rect x="126" y="39" width="44" height="34" rx="5" fill="#fff3cc" stroke="#111" stroke-width="1.5"/>
  <text x="148" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#111" font-family="sans-serif">过滤</text>

  <!-- Upper branch: Filtrate A -->
  <path d="M170,48 L194,48 L194,38 L224,38" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="195" y="34" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">滤液A</text>
  <rect x="226" y="24" width="86" height="30" rx="5" fill="#e6f7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="269" y="43" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32" font-family="sans-serif">FeSO4 溶液</text>

  <!-- Lower branch: Residue B -->
  <path d="M170,64 L188,64 L188,98" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="130" y="100" width="88" height="36" rx="5" fill="#ffeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="174" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b" font-family="sans-serif">滤渣B：Cu＋Fe</text>
  <text x="174" y="130" text-anchor="middle" font-size="8.5" fill="#555" font-family="sans-serif">(含过量铁粉)</text>

  <!-- Add dilute H2SO4 -> Filter 2 -->
  <line x1="218" y1="118" x2="262" y2="118" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr-r)"/>
  <text x="240" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b" font-family="sans-serif">稀硫酸</text>
  <text x="240" y="131" text-anchor="middle" font-size="8.5" fill="#555" font-family="sans-serif">除Fe/过滤</text>

  <!-- Pure Cu -->
  <rect x="264" y="101" width="48" height="34" rx="5" fill="#ffeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="288" y="117" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b" font-family="sans-serif">纯 Cu</text>
  <text x="288" y="129" text-anchor="middle" font-size="8.5" fill="#555" font-family="sans-serif">(不溶)</text>

  <!-- Filtrate C merges up to FeSO4 -->
  <path d="M269,101 L269,56" fill="none" stroke="#2e7d32" stroke-width="1.4" stroke-dasharray="4,2" marker-end="url(#arr-g)"/>
  <text x="292" y="82" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">滤液C合并</text>

  <!-- Crystallization note -->
  <rect x="10" y="148" width="300" height="52" rx="5" fill="#f8f9fa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="18" y="164" font-size="9.5" fill="#111" font-family="sans-serif">① 反应1：Fe＋CuSO4＝FeSO4＋Cu（过量铁确保除尽 Cu²⁺）</text>
  <text x="18" y="180" font-size="9.5" fill="#c0392b" font-family="sans-serif">② 反应2：Fe＋H2SO4＝FeSO4＋H2↑（不能用稀盐酸防引入 Cl⁻）</text>
  <text x="18" y="195" font-size="9.5" fill="#2e7d32" font-family="sans-serif">③ 滤液A＋C 合并 → 蒸发浓缩、降温结晶、过滤得 FeSO4 晶体</text>
</svg>
