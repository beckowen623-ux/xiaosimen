<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#111"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker>
  </defs>
  <text x="160" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111" font-family="sans-serif">反应后溶液溶质成分：猜想与检验三步法</text>
  <text x="160" y="34" text-anchor="middle" font-size="9.5" fill="#555" font-family="sans-serif">模型：反应物 A ＋ 反应物 B → 可溶生成物 C ＋ 沉淀/气体/水</text>

  <!-- Step 1 -->
  <rect x="10" y="45" width="84" height="72" rx="6" fill="#eef4fb" stroke="#2c6eb5" stroke-width="1.5"/>
  <text x="52" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#2c6eb5" font-family="sans-serif">Step 1 定必有</text>
  <text x="52" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#111" font-family="sans-serif">一定有生成物 C</text>
  <text x="52" y="96" text-anchor="middle" font-size="8.5" fill="#555" font-family="sans-serif">如中和必含 NaCl</text>
  <text x="52" y="109" text-anchor="middle" font-size="8.5" fill="#555" font-family="sans-serif">不必再检验 C</text>

  <line x1="94" y1="81" x2="112" y2="81" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="114" y="45" width="92" height="72" rx="6" fill="#fff3cc" stroke="#b7791f" stroke-width="1.5"/>
  <text x="160" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#b7791f" font-family="sans-serif">Step 2 猜过量</text>
  <text x="160" y="78" text-anchor="middle" font-size="9" fill="#111" font-family="sans-serif">① 恰好：只有 C</text>
  <text x="160" y="92" text-anchor="middle" font-size="9" fill="#111" font-family="sans-serif">② A 过量：C＋A</text>
  <text x="160" y="106" text-anchor="middle" font-size="9" fill="#111" font-family="sans-serif">③ B 过量：C＋B</text>

  <line x1="206" y1="81" x2="224" y2="81" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arr-r)"/>

  <!-- Step 3 -->
  <rect x="226" y="45" width="84" height="72" rx="6" fill="#e6f7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="268" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e7d32" font-family="sans-serif">Step 3 选试剂</text>
  <text x="268" y="79" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#111" font-family="sans-serif">检专属特征离子</text>
  <text x="268" y="95" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">检 H⁺：石蕊/Zn/CO3²⁻</text>
  <text x="268" y="109" text-anchor="middle" font-size="8.5" fill="#2e7d32" font-family="sans-serif">检 OH⁻：酚酞/Cu²⁺</text>

  <!-- Pitfall warning box -->
  <rect x="10" y="128" width="300" height="72" rx="6" fill="#ffeaea" stroke="#c0392b" stroke-width="1.4"/>
  <text x="20" y="145" font-size="10" font-weight="bold" fill="#c0392b" font-family="sans-serif">两大中考必杀防错红线：</text>
  <text x="20" y="162" font-size="9.5" fill="#111" font-family="sans-serif">✗ 错猜“C＋A＋B”：A 与 B 会继续反应，绝不能同时剩余！</text>
  <text x="20" y="178" font-size="9.5" fill="#111" font-family="sans-serif">✗ 检 HCl 错加 AgNO3：生成物 NaCl 也含 Cl⁻，必产白沉淀干扰！</text>
  <text x="20" y="193" font-size="9" fill="#2c6eb5" font-family="sans-serif">✓ 避开 C 的共有离子（Cl⁻/SO4²⁻/Na⁺），只测 A 或 B 独有的特征离子！</text>
</svg>
