<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <text x="160" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#111" font-family="sans-serif">初中酸碱盐四大“不共存”离子配对图</text>

  <!-- Card 1: Water -->
  <rect x="10" y="30" width="145" height="62" rx="6" fill="#eef4fb" stroke="#2c6eb5" stroke-width="1.5"/>
  <text x="82" y="47" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2c6eb5" font-family="sans-serif">① 结合成水（中和）</text>
  <text x="82" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#111" font-family="sans-serif">H⁺ ＋ OH⁻ → H2O</text>
  <text x="82" y="83" text-anchor="middle" font-size="9" fill="#555" font-family="sans-serif">酸性(pH＜7)与碱性互斥</text>

  <!-- Card 2: Gas -->
  <rect x="165" y="30" width="145" height="62" rx="6" fill="#fff3cc" stroke="#b7791f" stroke-width="1.5"/>
  <text x="237" y="47" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b7791f" font-family="sans-serif">② 结合成气体（↑）</text>
  <text x="237" y="65" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111" font-family="sans-serif">H⁺＋CO3²⁻/HCO3⁻ → CO2↑</text>
  <text x="237" y="83" text-anchor="middle" font-size="10" fill="#c0392b" font-family="sans-serif">NH4⁺＋OH⁻ → NH3↑＋H2O</text>

  <!-- Card 3: Acid-insoluble Precipitate -->
  <rect x="10" y="100" width="145" height="64" rx="6" fill="#ffeaea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="82" y="117" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b" font-family="sans-serif">③ 不溶于酸的沉淀</text>
  <text x="82" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111" font-family="sans-serif">Ba²⁺ ＋ SO4²⁻ → BaSO4↓</text>
  <text x="82" y="154" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111" font-family="sans-serif">Ag⁺ ＋ Cl⁻ → AgCl↓</text>

  <!-- Card 4: Carbonate and Alkali Precipitate -->
  <rect x="165" y="100" width="145" height="64" rx="6" fill="#e6f7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="237" y="117" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e7d32" font-family="sans-serif">④ 碳酸盐与碱沉淀</text>
  <text x="237" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#111" font-family="sans-serif">Ca²⁺/Ba²⁺＋CO3²⁻ → 白↓</text>
  <text x="237" y="154" text-anchor="middle" font-size="9.5" fill="#111" font-family="sans-serif">Cu²⁺/Fe³⁺/Mg²⁺＋OH⁻ → ↓</text>

  <!-- Footer: Hidden conditions -->
  <rect x="10" y="172" width="300" height="30" rx="5" fill="#f8f9fa" stroke="#cfd8dc" stroke-width="1"/>
  <text x="160" y="185" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#c0392b" font-family="sans-serif">隐含铁律：“无色”排 Cu²⁺(蓝) Fe²⁺(浅绿) Fe³⁺(黄) MnO4⁻(紫红)</text>
  <text x="160" y="198" text-anchor="middle" font-size="9" fill="#333" font-family="sans-serif">pH＜7 隐含 H⁺；pH＞7(酚酞变红) 隐含 OH⁻；能共存必无沉淀/气体/水</text>
</svg>
