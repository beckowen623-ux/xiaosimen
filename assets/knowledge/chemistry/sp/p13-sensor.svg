<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <rect width="320" height="210" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f2937"/>
    </marker>
  </defs>
  <text x="160" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827" font-family="sans-serif">数字化传感实验典型曲线示意图</text>

  <!-- Left panel: 测氧压强曲线 -->
  <rect x="6" y="24" width="150" height="178" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="81" y="38" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8" font-family="sans-serif">1. 测氧实验压强曲线</text>
  <!-- Axes -->
  <line x1="26" y1="158" x2="148" y2="158" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="26" y1="158" x2="26" y2="48" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="148" y="169" text-anchor="end" font-size="8" fill="#334155" font-family="sans-serif">时间 t</text>
  <text x="10" y="56" font-size="8" fill="#334155" font-family="sans-serif">P</text>
  <!-- Atmospheric baseline -->
  <line x1="26" y1="98" x2="144" y2="98" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="143" y="94" text-anchor="end" font-size="7.2" fill="#64748b" font-family="sans-serif">初始大气压</text>
  <!-- Pressure curve -->
  <path d="M26,98 L38,98 Q48,54 58,58 Q74,66 94,136 L112,136 L124,99 L142,99" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- Key points -->
  <circle cx="56" cy="58" r="2.2" fill="#dc2626"/>
  <text x="61" y="55" font-size="7.5" fill="#dc2626" font-family="sans-serif">燃放热升温</text>
  <circle cx="94" cy="136" r="2.2" fill="#2563eb"/>
  <text x="68" y="148" font-size="7.5" fill="#2563eb" font-family="sans-serif">耗氧冷却降压</text>
  <circle cx="112" cy="136" r="2.2" fill="#047857"/>
  <text x="109" y="128" font-size="7.5" fill="#047857" font-family="sans-serif">开夹进水</text>
  <text x="81" y="182" text-anchor="middle" font-size="7.8" fill="#334155" font-family="sans-serif">先升(放热)→骤降(耗O2)</text>
  <text x="81" y="194" text-anchor="middle" font-size="7.8" fill="#047857" font-family="sans-serif">→开止水夹回升至大气压</text>

  <!-- Right panel: 酸碱中和 pH 与温度双曲线 -->
  <rect x="164" y="24" width="150" height="178" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="239" y="38" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1d4ed8" font-family="sans-serif">2. 酸碱中和 pH 与温度</text>
  <!-- Axes -->
  <line x1="184" y1="158" x2="304" y2="158" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="184" y1="158" x2="184" y2="48" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="304" y="169" text-anchor="end" font-size="7.8" fill="#334155" font-family="sans-serif">V(稀盐酸)</text>
  <text x="168" y="56" font-size="7.8" fill="#2563eb" font-family="sans-serif">pH</text>
  <text x="168" y="67" font-size="7.8" fill="#dc2626" font-family="sans-serif">T</text>
  <!-- pH=7 line -->
  <line x1="184" y1="106" x2="300" y2="106" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="180" y="109" text-anchor="end" font-size="7.5" fill="#475569" font-family="sans-serif">7</text>
  <!-- Neutralization vertical guide -->
  <line x1="242" y1="54" x2="242" y2="158" stroke="#16a34a" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- pH curve (NaOH + HCl: starts >7, drops steeply through 7, ends <7) -->
  <path d="M184,64 C216,66 232,74 242,106 C252,138 266,144 298,146" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="189" y="59" font-size="7.5" fill="#2563eb" font-family="sans-serif">pH曲线(碱加酸)</text>
  <!-- Temperature curve (rises to peak at x=242, then cools) -->
  <path d="M184,138 Q216,122 242,74 Q268,118 298,132" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="275" y="84" text-anchor="middle" font-size="7.5" fill="#dc2626" font-family="sans-serif">温度T曲线</text>
  <circle cx="242" cy="106" r="2.4" fill="#16a34a"/>
  <circle cx="242" cy="74" r="2.4" fill="#dc2626"/>
  <text x="242" y="182" text-anchor="middle" font-size="7.8" fill="#16a34a" font-family="sans-serif">pH=7 与温度最高点重合</text>
  <text x="242" y="194" text-anchor="middle" font-size="7.8" fill="#334155" font-family="sans-serif">→恰好完全中和(放热反应)</text>
</svg>
