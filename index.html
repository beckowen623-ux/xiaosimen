<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="xiaosimen-paid-launch-date" content="">
  <meta name="description" content="全国人教版初中小四门刷题。按年级和学期练习道德与法治、历史、地理、生物：选择题、填空速记、材料分析与论述题（得分点自评），订正错题、跟踪进度和每日打卡。">
  <title>小四门刷题 · 人教版</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=13">
  <script src="./data/daily-questions-xiaosimen.js?v=7" defer></script>
  <link rel="stylesheet" href="./referrals.css?v=1">
  <script src="./referrals.js?v=2" defer></script>
  <script src="./app.js?v=14" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./" id="homeLink">
          <img src="./assets/icons/icon.svg" width="42" height="42" alt="">
          <span><b>小四门刷题</b><small>全国 · 人教版</small></span>
        </a>
        <div class="topbar-tools">
          <a href="./key-points.html" id="headerKeyPoints">考点</a>
          <a href="#searchPanel" id="headerSearch" hidden>找题</a>
          <button class="header-button" type="button" id="progressButton">进度管理</button>
          <span class="streak" id="streakBox" hidden>连续学习 <b id="streakDays">0</b> 天</span>
        </div>
      </div>
    </header>
    <main id="view" class="page" tabindex="-1">
      <div class="card loading-card" role="status">正在加载题库…</div>
      <noscript><p class="card">请启用 JavaScript，然后刷新页面开始练习。</p></noscript>
    </main>
    <footer class="foot">
      <a class="author-home-link" href="https://elx.cc.cd/?from=xiaosimen&amp;panel=feedback">作者的个人主页</a> · 有问题欢迎留言
      <div>学习记录保存在当前浏览器。换设备或网址前，可在「进度管理」下载备份。</div>
    </footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog class="dialog" id="progressDialog" aria-labelledby="progressTitle">
    <div class="dialog-head">
      <h2 id="progressTitle">进度管理</h2>
      <form method="dialog"><button class="btn text-button" aria-label="关闭进度管理">关闭</button></form>
    </div>
    <p class="muted">备份包含答题记录、错题、收藏、打卡积分和练习位置。文件只在本机处理。</p>
    <div class="dialog-actions">
      <button class="btn primary" id="exportBtn" type="button">下载备份</button>
      <button class="btn" id="importBtn" type="button">选择备份文件</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <p id="importMessage" class="muted" role="status"></p>
    <div class="dialog-actions" id="importPreview" hidden>
      <button class="btn primary" id="confirmImport" type="button">覆盖并导入</button>
      <button class="btn" id="cancelImport" type="button">取消</button>
    </div>
    <p class="data-reset"><button class="btn text-button danger" id="resetBtn" type="button">清空本机进度</button></p>
  </dialog>
  <dialog class="dialog" id="unlockDialog" aria-labelledby="unlockTitle">
    <div class="dialog-head">
      <h2 id="unlockTitle">小四门·提分工具</h2>
      <form method="dialog"><button class="btn text-button" aria-label="关闭兑换窗口">关闭</button></form>
    </div>
    <p class="muted" id="unlockReason"></p>
    <div class="access-offers">
      <section id="schoolOffer">
        <h3>小四门完整版 ¥19.9</h3>
        <a class="btn" target="_blank" rel="noopener noreferrer" hidden>去闲鱼购买</a>
        <button class="btn" type="button" hidden>复制闲鱼口令</button>
      </section>
      <section id="bundleOffer">
        <h3>双题库套餐 ¥29.8</h3>
        <a class="btn" target="_blank" rel="noopener noreferrer" hidden>去闲鱼购买套餐</a>
        <button class="btn" type="button" hidden>复制套餐口令</button>
      </section>
    </div>
    <p class="muted">兑换后每个适用题库可激活两个浏览器。套餐码可在两个题库分别兑换。</p>
    <form class="redeem-form" id="redeemForm">
      <label for="accessCode">已有兑换码</label>
      <div class="dialog-actions">
        <input type="text" id="accessCode" maxlength="64" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" required>
        <button class="btn primary" type="submit">兑换</button>
      </div>
      <label class="referral-input">邀请码（首次兑换时选填）<input id="inviteCode" type="text" maxlength="13" autocomplete="off" autocapitalize="characters"></label>
    </form>
    <p id="redeemMessage" class="muted" role="status"></p>
  </dialog>
  <dialog class="dialog figure-dialog" id="figureDialog" aria-label="查看题目配图">
    <form method="dialog"><button class="btn text-button" aria-label="关闭配图">关闭</button></form>
    <img id="figureFull" alt="题目配图放大">
    <p class="muted" id="figureSource"></p>
  </dialog>
</body>
</html>
