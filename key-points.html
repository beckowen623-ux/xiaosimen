<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="description" content="人教版初中全科考点速记与默写。分册查看语文、英语、道法、历史、地理、生物学的核心考点、易错红线与回忆自测，支持背诵遮罩与 A4 挖空默写纸。">
  <title>全科考点速记与默写 · 爱丽克丝中考题库</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icons/elx-badge.svg">
  <link rel="stylesheet" href="./styles.css?v=28">
  <link rel="stylesheet" href="./key-points.css?v=6">
  <script src="./data/key-points-yuwen.js?v=3" defer></script>
  <script src="./data/key-points-yingyu.js?v=3" defer></script>
  <script src="./data/key-points-daode.js?v=2" defer></script>
  <script src="./data/key-points-lishi.js?v=2" defer></script>
  <script src="./data/key-points-dili.js?v=2" defer></script>
  <script src="./data/key-points-shengwu.js?v=2" defer></script>
  <script src="./key-points.js?v=4" defer></script>
</head>
<body>
  <a class="skip-link" href="#view">跳到主要内容</a>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./">
          <img src="./assets/icons/elx-badge.svg" width="42" height="42" alt="">
          <span><b>爱丽克丝中考题库</b><small>全科考点速记与默写 · 语英＋小四门共 283 条</small></span>
        </a>
        <div class="topbar-tools"><a href="./lab-yy.html">语英工坊</a><a href="./lab-x4m.html">小四门实验室</a><a href="./">返回题库</a></div>
      </div>
    </header>
    <main class="page points-page" id="view" tabindex="-1">
      <section class="study-hero points-hero" aria-labelledby="pointsTitle">
        <img class="hero-art" src="./assets/study-desk.webp" alt="" width="960" height="640">
        <div class="hero-content">
          <h1 id="pointsTitle">全科考点速记与默写</h1>
          <p>覆盖语文、英语、道法、历史、地理、生物共 253 条权威复核核心考点（人教版分册，配一句话秒记口诀）。开启背诵遮罩或一键打印 A4 挖空默写纸。</p>
        </div>
      </section>
      <div class="kp-lab-banner">
        <div>
          <b>🎮 小四门死记硬背太痛苦？去《反死记硬背实验室》边玩边记！</b>
          <span>历史听故事+排时间轴、道法 30 秒生活判官、地理因果多米诺、生物红细胞大冒险（共 57 关＋6 期专属女声故事）</span>
        </div>
        <a class="btn primary" href="./lab-x4m.html">立即体验 →</a>
      </div>
      <section class="card point-filters" id="pointFilters" aria-label="筛选考点" hidden>
        <div class="point-subjects" id="pointSubjects" role="group" aria-label="科目"></div>
        <div class="point-fields">
          <input id="pointSearch" type="search" aria-label="搜索本学科考点" placeholder="搜索本学科考点">
          <select id="pointStage" aria-label="册次"></select>
          <select id="pointType" aria-label="考点类型">
            <option value="">全部类型</option>
            <option value="core">应知应会</option>
            <option value="trap">易错辨析</option>
          </select>
        </div>
        <div class="point-recite-bar">
          <button type="button" class="btn" id="pointReciteBtn" aria-pressed="false">👁️ 开启背诵遮罩</button>
          <button type="button" class="btn" id="pointRevealAllBtn" hidden>全部揭晓</button>
          <button type="button" class="btn" id="pointHideAllBtn" hidden>全部重遮</button>
          <button type="button" class="btn" id="pointPrintNoteBtn">🖨️ 打印 A4 速记单</button>
          <button type="button" class="btn primary" id="pointPrintBlankBtn">📝 打印 A4 挖空默写纸</button>
        </div>
      </section>
      <p class="points-summary" id="pointStatus" role="status">正在加载考点…</p>
      <div id="pointResults"></div>
      <noscript><p class="card">启用 JavaScript 后可查看考点和自测。</p></noscript>
    </main>
    <footer class="foot"><a href="./">返回爱丽克丝中考题库</a></footer>
  </div>
</body>
</html>
